<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}示波器刷刷乐{% endblock %}</title>
    <script>
        /* 入场动画只播一次：新会话首开、F5 重来都播；点链接跳页跳过（同 Yue 的规则） */
        try {
            var _nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
            if (!(_nav && _nav.type === 'reload') && sessionStorage.scopeEntered) {
                document.documentElement.classList.add('no-entrance');
            }
            sessionStorage.scopeEntered = '1';
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v('style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='scope.css') }}?v={{ asset_v('scope.css') }}">
    <link rel="icon" href="data:,">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <span class="brand-cn">示波器刷刷乐</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link {% if nav == 'index' %}active{% endif %}">波形</a>
                <a href="/record" class="nav-link {% if nav == 'record' %}active{% endif %}">记录</a>
                <a href="/about" class="nav-link {% if nav == 'about' %}active{% endif %}">关于</a>
            </div>
            <div class="nav-right">
                <span class="conn-pill" title="仪器连接状态">
                    <span class="conn-dot" id="connDot"></span><span id="connText">连接中…</span>
                </span>
                <span class="conn-pill err-pill" id="errPill" hidden>
                    <span class="conn-dot err"></span><span id="errText"></span>
                </span>
                <a class="nav-link nav-social" href="https://github.com/Prlock4367" target="_blank" rel="noopener" title="GitHub">GitHub</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-content">
            <p class="footer-brand">示波器刷刷乐 <span class="footer-dot">·</span> RIGOL DS2102E 网页控制台<span id="demoBadge"></span></p>
            <p class="footer-sub">Prlock4367 个人项目 · MIT 开源</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}?v={{ asset_v('main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
    <script>
        /* 悬浮药丸导航：滚动 0→160px 连续插值 --np（同 Yue，别改成 class 切换，
           病根是触发时机——到顶后才变形，视觉上像"加速"） */
        (function () {
            var nav = document.querySelector('nav');
            var onScroll = function () {
                var sc = window.scrollY || document.documentElement.scrollTop || 0;
                var p = Math.min(sc / 160, 1);
                nav.style.setProperty('--np', p * p * (3 - 2 * p));
            };
            addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        })();
    </script>
</body>
</html>
