# 复制成 config.ini 后按自己机器改（config.ini 不进版本库）

[scope]
# 示波器地址。Auto-IP 地址由网卡 MAC 决定，断电重启后不变
# 仪器地址。留空 = 读 config.ini 同目录的 config.ini 也没有时走 DEMO。
# 连真机：把示波器的 IP 填在这里（LAN 直连且无 DHCP 时是 169.254.x.x 的 Auto-IP，
# 可在示波器 Utility → IO Setting → LAN Set 里看到）。
ip =

[web]
port = 8760

[paths]
# 记录落哪：截图 PNG + 波形 CSV，按日期分子文件夹（YYYYMMDD-附件）。
# 留空 = 项目内的 records/
# 现场想跟工作记录放一起时填绝对路径，例如：
# record_root = D:/my-records/示波器记录
record_root =
